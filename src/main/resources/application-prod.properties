spring.datasource.url=jdbc:postgresql://${PHINPARKS_DB_HOST}:${PHINPARKS_DB_PORT}/${PHINPARKS_DB_NAME}
spring.datasource.username=${PHINPARKS_DB_USER}
spring.datasource.password=${PHINPARKS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true
logging.level.com.phinpark=INFO
